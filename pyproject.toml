[project]
name = "motdd"
version = "0.1.0"
description = "Message Of The Developer Day - unified dashboard for developers"
authors = [{name = "Pavel Dostal", email = "pdostal@pdostal.cz"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["developer", "dashboard", "cli", "github", "gitlab", "forgejo", "gitea", "obs", "notifications", "pull-requests"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = [
    "rich>=13.0.0",
    "textual>=0.40.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
motdd = "motdd.__main__:main"

[project.urls]
Homepage = "https://github.com/pdostal/motdd"
Repository = "https://github.com/pdostal/motdd"
Issues = "https://github.com/pdostal/motdd/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=motdd --cov-report=term-missing"
